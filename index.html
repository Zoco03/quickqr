<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickQR - QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Quick<span>QR</span></h1>
        <p class="subtitle">Generate QR codes instantly.</p>

        <div class="card">
            <input 
                type="text" 
                id="textInput" 
                placeholder="Enter text or URL..."
            >

            <button onclick="generateQR()">Generate QR</button>

            <div id="qrcode"></div>

            <button id="downloadBtn" onclick="downloadQR()" class="download">
                Download QR Code
            </button>
        </div>

        <p class="footer">Simple. Fast. Private.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
